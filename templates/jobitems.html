{% if job["level"] != "low" %}
  <div class="border-bottom row" style="margin-bottom: 16px; padding-bottom: 10px;">
  <div class="col-9">
    <h4 style="color:rgb(120,120,120); margin-bottom: 4px;"><b>Task: </b>{{job["task"]}}</h4>
    <div><b>Time Required: </b>{{job["time"]}}</div>
    <div><b>Level: </b>{{job["level"]}}</div>
  </div>
  <div class="col-3">
     <button type="button" class="btn btn-outline-info">Doing</button>
  </div>
  </div>
{% endif %}
